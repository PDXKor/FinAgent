[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.1.0"
description = "Small-cap financial data agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2",
    "duckdb>=1.5,<2",
    "pandas>=2.2",
    "httpx>=0.27",
    "exchange_calendars>=4.5",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "langchain-anthropic>=1.7",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
dev = ["pytest", "ruff"]

[project.scripts]
recon = "recon.cli:main"
finagent-agents = "finagent_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recon", "src/finagent_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: pure, no DB/network", "component: temp DB + fakes", "contract: real vs fake", "live: calls a paid external API"]

[tool.ruff]
line-length = 100
