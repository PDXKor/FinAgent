[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent-agents"
version = "0.1.0"
description = "Small-cap financial data agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "langchain-anthropic>=1.7",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
dev = ["pytest", "ruff"]

[project.scripts]
finagent-agents = "finagent_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["unit: pure, no DB/network", "component: temp DB + fakes", "contract: real vs fake", "live: calls a paid external API"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"finagent".msg = "agents reach data over HTTP only (HttpDataLayer); never import the data package"
