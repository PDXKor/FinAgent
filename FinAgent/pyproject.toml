[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.1.0"
description = "Cloud-neutral LangGraph agents that retrieve financial information on a schedule."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
dev = ["pytest", "ruff"]

[project.scripts]
finagent = "finagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
